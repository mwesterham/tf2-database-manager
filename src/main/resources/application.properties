# Server
server.port=${PORT:8081}

# DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tf2autobot}
spring.datasource.username=${DB_USER:tf2autobot}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# API token auth — leave blank to disable auth (dev mode)
app.api-token=${DB_MANAGER_API_TOKEN:}

# Pricer integration
app.pricer.base-url=${PRICER_BASE_URL:http://tf2-pricing-service.tf2-auto-bot.svc.cluster.local:8080}

# Candidate scheduler
# Cron: every 6 hours by default
app.candidate.schedule=${CANDIDATE_SCHEDULE:0 0 */6 * * *}
app.candidate.max-auto-managed=${CANDIDATE_MAX_AUTO_MANAGED:30}
app.candidate.fetch-limit=${CANDIDATE_FETCH_LIMIT:50}

# Logging
logging.level.com.tf2autobot=INFO
logging.level.org.flywaydb=INFO
